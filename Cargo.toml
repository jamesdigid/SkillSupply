[package]
name = "skillsupport"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Open capability registry and catalog for autonomous agents"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "skillsupport"

[[bin]]
name = "caps"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tungstenite = "0.30"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
