name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the release once, up front. Doing this in a dedicated job avoids the
  # race where every matrix job tries to create/find the release at the same
  # time (which caused "release not found" failures). Tags containing a hyphen
  # (e.g. v0.0.1-rc1) are automatically marked as pre-releases.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A hyphenated tag (e.g. v0.0.1-rc.1) is automatically published as a
      # pre-release; a plain tag (e.g. v0.0.1) becomes a stable release. The
      # installer resolves the tag via the API, so it finds either one.
      - name: Create release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

  # Builds the binary, packages it as `caps-<target>.tar.gz` with the raw
  # `caps` executable at the archive root, and attaches it to the release
      # created above. This is exactly what install.sh downloads.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: caps
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          token: ${{ secrets.GITHUB_TOKEN }}
