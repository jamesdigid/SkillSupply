name: Install Smoke

on:
  release:
    types: [published]

jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install SkillSupport
        run: |
          sh ./install.sh
          echo "$HOME/.skillsupport/bin" >> "$GITHUB_PATH"
        env:
          SKILLSUPPORT_VERSION: ${{ github.event.release.tag_name }}

      - name: Verify binary and learn flow
        run: |
          caps --version
          caps init
          caps learn browser-attach --registry tests/fixtures/registry
